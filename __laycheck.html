<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0}</style></head>
<body><div id="out">checking</div><iframe id="f" style="border:0"></iframe>
<script>
var p=new URLSearchParams(location.search), w=+p.get('w')||360, h=+p.get('h')||640;
var f=document.getElementById('f'); f.width=w; f.height=h; f.src='index.html#company';
f.onload=function(){ setTimeout(check, 2600); };
function check(){
  try{
    var doc=f.contentDocument, vw=w, issues=[];
    if(f.contentWindow.innerWidth && doc.documentElement.scrollWidth-doc.documentElement.clientWidth>2 && getComputedStyle(doc.body).overflowX!=='hidden') issues.push('page h-scroll');
    ['topbar','ticker','actBar','breakthroughBtn','nudge','buyModeBar','tabbar','genList','riskMini'].forEach(function(id){
      var e=doc.getElementById(id); if(!e||e.classList.contains('hidden')) return;
      var r=e.getBoundingClientRect();
      if(r.right>vw+1) issues.push(id+' rightspill '+Math.round(r.right)+'>'+vw);
      if(r.left<-1) issues.push(id+' leftspill');
      if(e.scrollWidth>e.clientWidth+2) issues.push(id+' textoverflow '+e.scrollWidth+'>'+e.clientWidth);
    });
    var n=doc.getElementById('nudge');
    if(n && !n.classList.contains('hidden')){ var nh=n.getBoundingClientRect().height; if(nh>110) issues.push('nudge_oval h='+Math.round(nh)); }
    document.getElementById('out').textContent = issues.length? ('LAYFAIL@'+w+'x'+h+': '+issues.join(' | ')) : ('LAYOK@'+w+'x'+h);
  }catch(e){ document.getElementById('out').textContent='ERR '+e; }
}
</script></body></html>
