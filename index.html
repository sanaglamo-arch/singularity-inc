<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06060f">
<title>Singularity Inc.</title>
<link rel="stylesheet" href="fonts.css?v=4">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header id="topbar">
    <div id="brand"><span id="brandIcon"></span><span id="brandName">Singularity Inc.</span></div>
    <div id="cashBox">
      <div id="cashVal">0</div>
      <div id="cpsVal">0/sec</div>
    </div>
    <div id="boostBadge" class="hidden"></div>
    <div id="eventBadge" class="hidden"></div>
  </header>

  <!-- Satirical news ticker (narrative arc, stage-based) -->
  <div id="ticker"><span class="tk-ico"></span><span id="tickerText"></span></div>

  <!-- Content tabs -->
  <main id="content">
    <section class="tab active" data-tab="company">
      <div id="tapZone">
        <button id="tapBtn" aria-label="train">
          <span id="tapIcon"></span>
          <span id="tapLabel">TRAIN</span>
          <span id="tapValue"></span>
        </button>
        <div id="tapHint"></div>
        <div id="comboWrap">
          <div id="comboLabel"><span id="comboName"></span><span id="comboMult"></span></div>
          <div id="comboBar"><div id="comboFill"></div></div>
        </div>
        <button id="breakthroughBtn" class="hidden"></button>
        <div id="riskMini">
          <div id="riskMiniLabel"></div>
          <div class="bar"><div id="riskMiniFill"></div></div>
        </div>
      </div>
      <div id="nudge" class="hidden"><span class="nicon"></span><span id="nudgeText"></span></div>
      <div class="scroll" id="genList"></div>
    </section>

    <section class="tab" data-tab="upgrades">
      <div class="scroll" id="upgradesPane">
        <h2 id="upgradesTitle"></h2>
        <div id="upgradeList"></div>
        <div id="upgradeEmpty" class="empty-state hidden"></div>
        <h2 id="managersTitle"></h2>
        <div id="managerList"></div>
        <div id="managerEmpty" class="empty-state hidden"></div>
      </div>
    </section>

    <section class="tab" data-tab="research">
      <div class="scroll" id="researchPane">
        <h2 id="researchTitle"></h2>
        <p id="researchDesc" class="muted"></p>
        <div id="prestigeBox">
          <div id="prestigeGain"></div>
          <button id="prestigeBtn"></button>
          <div id="rpHave" class="muted"></div>
          <div id="currentBonus" class="accent"></div>
        </div>
        <h2 id="artifactsTitle"></h2>
        <div id="artSynergy" class="muted small"></div>
        <div id="artifactList"></div>
        <h2 id="techTitle"></h2>
        <div id="techList"></div>
        <h2 id="prestigeUpTitle"></h2>
        <div id="prestigeUpList"></div>
        <div class="tip" id="researchTip"></div>
      </div>
    </section>

    <section class="tab" data-tab="singularity">
      <div class="scroll" id="singPane">
        <h2 id="singTitle"></h2>
        <p id="singDesc" class="muted"></p>
        <div id="singBox" class="glass-panel">
          <div id="singGain"></div>
          <button id="singBtn"></button>
          <div id="coresHave" class="muted"></div>
          <div id="coresBonus" class="accent"></div>
        </div>
        <h2 id="metaTitle"></h2>
        <div id="metaList"></div>
      </div>
    </section>

    <section class="tab" data-tab="alignment">
      <div class="scroll" id="alignPane">
        <h2 id="alignTitle"></h2>
        <p id="alignIntro" class="muted"></p>
        <div id="incidentBox" class="hidden"></div>
        <div id="riskPanel">
          <div class="meterRow"><span id="riskLabel"></span><span id="riskPct"></span></div>
          <div class="bar big"><div id="riskFill"></div></div>
          <div id="riskGainTxt" class="muted small"></div>
          <div class="meterRow" style="margin-top:14px"><span id="alignLabel"></span><span id="alignOwned"></span></div>
          <div id="alignSuppressTxt" class="muted small"></div>
          <button id="buyAlignBtn"></button>
        </div>
        <div class="minigrid" id="alignMini"></div>
        <div class="tip" id="alignTip"></div>
      </div>
    </section>

    <section class="tab" data-tab="stats">
      <div class="scroll" id="statsPane">
        <h2 id="statsTitle"></h2>
        <div id="statList"></div>
      </div>
    </section>

    <section class="tab" data-tab="achievements">
      <div class="scroll" id="achPane">
        <h2 id="achTitle"></h2>
        <div id="achProgress" class="muted"></div>
        <div id="achList"></div>
      </div>
    </section>

    <section class="tab" data-tab="settings">
      <div class="scroll" id="settingsPane">
        <h2 id="settingsTitle"></h2>
        <div class="setting-row"><span id="langLabel"></span>
          <div class="seg" id="langSeg">
            <button data-lang="en">EN</button><button data-lang="ru">RU</button>
          </div>
        </div>
        <div class="setting-row"><span id="soundLabel"></span>
          <div class="seg" id="soundSeg">
            <button data-sound="on"></button><button data-sound="off"></button>
          </div>
        </div>
        <div class="setting-row"><span id="musicLabel"></span>
          <div class="seg" id="musicSeg">
            <button data-music="on"></button><button data-music="off"></button>
          </div>
        </div>
        <div class="setting-row"><span id="adBoostLabel"></span><button id="adBoostBtn" class="adbtn"></button></div>
        <div class="setting-row"><span id="adCashLabel"></span><button id="adCashBtn" class="adbtn"></button></div>
        <h2 id="cosmeticsTitle" style="margin-top:18px"></h2>
        <div class="cos-row"><span id="cosOrbLabel" class="cos-label"></span><div id="cosOrbList" class="cos-list"></div></div>
        <div class="cos-row"><span id="cosThemeLabel" class="cos-label"></span><div id="cosThemeList" class="cos-list"></div></div>
        <button id="saveBtn" class="wide"></button>
        <button id="resetBtn" class="wide danger"></button>
        <p id="creditsTxt" class="muted small"></p>
        <p id="versionTxt" class="muted small"></p>
      </div>
    </section>
  </main>

  <!-- Buy-mode selector (floats above tab bar on Lab/Alignment) -->
  <div id="buyModeBar" class="hidden">
    <button data-mode="1">x1</button>
    <button data-mode="10">x10</button>
    <button data-mode="100">x100</button>
    <button data-mode="max">Max</button>
  </div>

  <!-- Bottom tab nav -->
  <nav id="tabbar">
    <button data-tab="company" class="active"><span class="ti"></span><span class="tl" id="nav_company"></span></button>
    <button data-tab="upgrades"><span class="ti"></span><span class="tl" id="nav_upgrades"></span></button>
    <button data-tab="research"><span class="ti"></span><span class="tl" id="nav_research"></span></button>
    <button data-tab="singularity" id="navSingBtn" class="hidden"><span class="ti"></span><span class="tl" id="nav_singularity"></span></button>
    <button data-tab="alignment"><span class="ti"></span><span class="tl" id="nav_alignment"></span></button>
    <button data-tab="stats"><span class="ti"></span><span class="tl" id="nav_stats"></span></button>
    <button data-tab="achievements"><span class="ti"></span><span class="tl" id="nav_achievements"></span></button>
    <button data-tab="settings"><span class="ti"></span><span class="tl" id="nav_settings"></span></button>
  </nav>
</div>

<div id="toastRoot"></div>
<div id="modalRoot" class="hidden"></div>
<div id="fxRoot"></div>

<!-- Splash / loading screen (shown instantly, before JS parses; faded out on boot) -->
<div id="splash">
  <div class="splash-orb">
    <svg viewBox="0 0 120 120" fill="none" stroke="#bfa6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="60" cy="60" r="7" fill="#fff" stroke="none"/>
      <circle cx="60" cy="60" r="20"/><circle cx="60" cy="60" r="34" opacity="0.6"/><circle cx="60" cy="60" r="48" opacity="0.3"/>
      <path d="M60 13v12M60 95v12M13 60h12M95 60h12M27 27l8 8M85 85l8 8M93 27l-8 8M35 85l-8 8"/>
    </svg>
  </div>
  <div class="splash-title">SINGULARITY INC.</div>
  <div class="splash-tag">From a garage script to an artificial god.</div>
  <div class="splash-bar"><div></div></div>
</div>

<script src="js/config.js?v=4"></script>
<script src="js/format.js?v=4"></script>
<script src="js/i18n.js?v=4"></script>
<script src="js/sdk.js?v=4"></script>
<script src="js/ads.js?v=4"></script>
<script src="js/game.js?v=4"></script>
<script src="js/audio.js?v=4"></script>
<script src="js/fx.js?v=4"></script>
<script src="js/icons.js?v=4"></script>
<script src="js/music.js?v=4"></script>
<script src="js/ui.js?v=4"></script>
<script src="js/main.js?v=4"></script>
</body>
</html>
