<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<title>Singularity Inc.</title>
<link rel="stylesheet" href="fonts.css?v=20">
<link rel="stylesheet" href="styles.css?v=20">
<link rel="stylesheet" href="fx.css?v=20">
</head>
<body>
<div id="app" class="app">
  <!-- ===== top HUD (money · rate · date · solvency · ticker) ===== -->
  <header class="hud" id="hud">
    <div class="hud-row">
      <span class="brand display" id="brand">SINGULARITY INC.</span>
      <span class="rate num" id="hudRate"></span>
    </div>
    <div class="money num" id="hudMoney">$0</div>
    <div class="hud-sub">
      <span class="num" id="hudDate"></span>
      <span class="solvency num" id="hudSolvency"></span>
    </div>
    <div class="ticker" id="hudTicker"><b id="tickerTag"></b><span id="tickerText"></span></div>
  </header>

  <!-- ===== screen: active tab content renders here ===== -->
  <main class="screen" id="screen"></main>

  <!-- ===== bottom nav (5 tabs) ===== -->
  <nav class="nav" id="nav">
    <button class="nav-item active" data-tab="company"><span class="ni" id="navIco-company"></span><span id="navLbl-company"></span></button>
    <button class="nav-item" data-tab="hardware"><span class="ni" id="navIco-hardware"></span><span id="navLbl-hardware"></span></button>
    <button class="nav-item" data-tab="model"><span class="ni" id="navIco-model"></span><span id="navLbl-model"></span></button>
    <button class="nav-item" data-tab="world"><span class="ni" id="navIco-world"></span><span id="navLbl-world"></span></button>
    <button class="nav-item" data-tab="settings"><span class="ni" id="navIco-settings"></span><span id="navLbl-settings"></span></button>
  </nav>
</div>

<!-- modal / scrim root (FTUE, events, endings) -->
<div id="modalRoot"></div>
<!-- telegraph warnings (fire / lawsuit hazard) -->
<div id="telegraphRoot"></div>
<!-- fx particle layer -->
<div id="fxRoot"></div>

<!-- splash (faded out on boot by main.js) -->
<div id="splash">
  <div class="splash-orb">
    <svg viewBox="0 0 120 120" fill="none" stroke="#bfa6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="60" cy="60" r="7" fill="#fff" stroke="none"/>
      <circle cx="60" cy="60" r="20"/><circle cx="60" cy="60" r="34" opacity="0.6"/><circle cx="60" cy="60" r="48" opacity="0.3"/>
      <path d="M60 13v12M60 95v12M13 60h12M95 60h12M27 27l8 8M85 85l8 8M93 27l-8 8M35 85l-8 8"/>
    </svg>
  </div>
  <div class="splash-title display">SINGULARITY INC.</div>
  <div class="splash-tag">От гаражного скрипта до искусственного бога.</div>
</div>

<script src="js/config.js?v=20"></script>
<script src="js/i18n.js?v=20"></script>
<script src="js/format.js?v=20"></script>
<script src="js/icons.js?v=20"></script>
<script src="js/fx.js?v=20"></script>
<script src="js/audio.js?v=20"></script>
<script src="js/music.js?v=20"></script>
<script src="js/sdk.js?v=20"></script>
<script src="js/ads.js?v=20"></script>
<script src="js/game.js?v=20"></script>
<script src="js/ui.js?v=20"></script>
<script src="js/main.js?v=20"></script>
</body>
</html>
