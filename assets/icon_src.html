<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b1020;
    width: 512px;
    height: 512px;
    overflow: hidden;
  }
  #root {
    width: 512px;
    height: 512px;
    overflow: hidden;
    display: block;
  }
</style>
</head>
<body>
<div id="root">
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#1a1a4e"/>
      <stop offset="45%" stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </radialGradient>

    <!-- Core glow gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#a0e8ff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#5cc8ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Node glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#5cc8ff"/>
      <stop offset="100%" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Violet node glow -->
    <radialGradient id="nodeGlowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold node glow -->
    <radialGradient id="nodeGlowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffd86b"/>
      <stop offset="100%" stop-color="#ffd86b" stop-opacity="0"/>
    </radialGradient>

    <!-- Arrow gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#5cc8ff"/>
      <stop offset="100%" stop-color="#ffd86b"/>
    </linearGradient>

    <!-- Edge glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow filter -->
    <filter id="glowStrong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow filter -->
    <filter id="glowSubtle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Mega glow for center -->
    <filter id="glowMega" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to canvas -->
    <clipPath id="canvasClip">
      <rect x="0" y="0" width="512" height="512"/>
    </clipPath>
  </defs>

  <!-- Solid background fill -->
  <rect x="0" y="0" width="512" height="512" fill="#0b1020"/>
  <!-- Background radial -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Subtle star field -->
  <g opacity="0.5">
    <circle cx="42" cy="38" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="130" cy="72" r="0.8" fill="#ffffff" opacity="0.4"/>
    <circle cx="85" cy="155" r="1.2" fill="#ffffff" opacity="0.5"/>
    <circle cx="470" cy="45" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="390" cy="90" r="0.8" fill="#ffffff" opacity="0.4"/>
    <circle cx="455" cy="170" r="1.1" fill="#ffffff" opacity="0.5"/>
    <circle cx="30" cy="300" r="0.9" fill="#ffffff" opacity="0.4"/>
    <circle cx="65" cy="420" r="1" fill="#ffffff" opacity="0.3"/>
    <circle cx="480" cy="350" r="0.8" fill="#ffffff" opacity="0.5"/>
    <circle cx="460" cy="460" r="1" fill="#ffffff" opacity="0.3"/>
    <circle cx="200" cy="30" r="0.7" fill="#ffffff" opacity="0.4"/>
    <circle cx="340" cy="55" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="155" cy="480" r="0.9" fill="#ffffff" opacity="0.3"/>
    <circle cx="370" cy="475" r="1.1" fill="#ffffff" opacity="0.4"/>
  </g>

  <g clip-path="url(#canvasClip)">

    <!-- ======================================================
         NEURAL NETWORK CONNECTIONS (edges drawn first)
         ====================================================== -->

    <!-- Bottom layer connections -->
    <g opacity="0.35" filter="url(#glowSubtle)">
      <!-- Bottom nodes to mid-left cluster -->
      <line x1="140" y1="400" x2="175" y2="320" stroke="#7c5cff" stroke-width="1.2"/>
      <line x1="200" y1="420" x2="175" y2="320" stroke="#7c5cff" stroke-width="1"/>
      <line x1="200" y1="420" x2="245" y2="340" stroke="#5cc8ff" stroke-width="1"/>
      <line x1="310" y1="415" x2="245" y2="340" stroke="#5cc8ff" stroke-width="1"/>
      <line x1="310" y1="415" x2="340" y2="325" stroke="#7c5cff" stroke-width="1"/>
      <line x1="372" y1="395" x2="340" y2="325" stroke="#7c5cff" stroke-width="1.2"/>

      <!-- Cross connections bottom layer -->
      <line x1="140" y1="400" x2="245" y2="340" stroke="#5cc8ff" stroke-width="0.7" opacity="0.5"/>
      <line x1="200" y1="420" x2="340" y2="325" stroke="#7c5cff" stroke-width="0.7" opacity="0.5"/>
      <line x1="310" y1="415" x2="175" y2="320" stroke="#5cc8ff" stroke-width="0.7" opacity="0.4"/>
    </g>

    <!-- Mid layer connections -->
    <g opacity="0.45" filter="url(#glowSubtle)">
      <!-- Mid nodes to upper cluster -->
      <line x1="175" y1="320" x2="195" y2="240" stroke="#5cc8ff" stroke-width="1.3"/>
      <line x1="175" y1="320" x2="256" y2="265" stroke="#7c5cff" stroke-width="1"/>
      <line x1="245" y1="340" x2="195" y2="240" stroke="#5cc8ff" stroke-width="1"/>
      <line x1="245" y1="340" x2="256" y2="265" stroke="#5cc8ff" stroke-width="1.5"/>
      <line x1="245" y1="340" x2="320" y2="245" stroke="#7c5cff" stroke-width="1"/>
      <line x1="340" y1="325" x2="256" y2="265" stroke="#5cc8ff" stroke-width="1.2"/>
      <line x1="340" y1="325" x2="320" y2="245" stroke="#7c5cff" stroke-width="1.3"/>
      <line x1="372" y1="395" x2="320" y2="245" stroke="#7c5cff" stroke-width="0.9"/>

      <!-- Cross connections mid -->
      <line x1="175" y1="320" x2="320" y2="245" stroke="#5cc8ff" stroke-width="0.6" opacity="0.4"/>
      <line x1="340" y1="325" x2="195" y2="240" stroke="#7c5cff" stroke-width="0.6" opacity="0.4"/>
    </g>

    <!-- Upper connections to center -->
    <g opacity="0.6" filter="url(#glow)">
      <line x1="195" y1="240" x2="256" y2="210" stroke="#5cc8ff" stroke-width="1.5"/>
      <line x1="195" y1="240" x2="256" y2="196" stroke="#5cc8ff" stroke-width="1.2"/>
      <line x1="256" y1="265" x2="256" y2="196" stroke="#7c5cff" stroke-width="2"/>
      <line x1="320" y1="245" x2="256" y2="210" stroke="#5cc8ff" stroke-width="1.5"/>
      <line x1="320" y1="245" x2="256" y2="196" stroke="#7c5cff" stroke-width="1.2"/>

      <!-- Wide fan to center core -->
      <line x1="155" y1="210" x2="256" y2="196" stroke="#5cc8ff" stroke-width="1"/>
      <line x1="358" y1="215" x2="256" y2="196" stroke="#7c5cff" stroke-width="1"/>
    </g>

    <!-- Center to apex connections (arrow shaft area) -->
    <g opacity="0.7" filter="url(#glow)">
      <line x1="256" y1="196" x2="256" y2="140" stroke="url(#arrowGrad)" stroke-width="2"/>
      <line x1="256" y1="196" x2="220" y2="155" stroke="#5cc8ff" stroke-width="1.2"/>
      <line x1="256" y1="196" x2="292" y2="155" stroke="#7c5cff" stroke-width="1.2"/>
      <line x1="220" y1="155" x2="256" y2="115" stroke="#5cc8ff" stroke-width="1.5"/>
      <line x1="292" y1="155" x2="256" y2="115" stroke="#ffd86b" stroke-width="1.5"/>
    </g>

    <!-- ======================================================
         UPWARD ARROW (the growth indicator)
         ====================================================== -->

    <!-- Arrow shaft glow behind -->
    <rect x="249" y="115" width="14" height="155" rx="4"
          fill="url(#arrowGrad)" opacity="0.15" filter="url(#glowMega)"/>

    <!-- Arrow shaft -->
    <rect x="251" y="120" width="10" height="150" rx="3"
          fill="url(#arrowGrad)" opacity="0.9" filter="url(#glow)"/>

    <!-- Arrow head -->
    <polygon points="256,68 228,128 284,128"
             fill="url(#arrowGrad)" opacity="0.95" filter="url(#glowStrong)"/>

    <!-- Arrow head inner highlight -->
    <polygon points="256,80 240,120 272,120"
             fill="url(#arrowGrad)" opacity="0.6"/>

    <!-- ======================================================
         NEURAL NODES
         ====================================================== -->

    <!-- Bottom layer nodes -->
    <g filter="url(#glow)">
      <!-- Bottom left -->
      <circle cx="140" cy="400" r="18" fill="url(#nodeGlowV)" opacity="0.25"/>
      <circle cx="140" cy="400" r="8" fill="#1a0a3e" stroke="#7c5cff" stroke-width="1.5"/>
      <circle cx="140" cy="400" r="4" fill="#7c5cff" opacity="0.9"/>
      <circle cx="140" cy="400" r="1.5" fill="#ffffff"/>

      <!-- Bottom center-left -->
      <circle cx="200" cy="420" r="18" fill="url(#nodeGlow)" opacity="0.25"/>
      <circle cx="200" cy="420" r="8" fill="#0a1a3e" stroke="#5cc8ff" stroke-width="1.5"/>
      <circle cx="200" cy="420" r="4" fill="#5cc8ff" opacity="0.9"/>
      <circle cx="200" cy="420" r="1.5" fill="#ffffff"/>

      <!-- Bottom center-right -->
      <circle cx="310" cy="415" r="18" fill="url(#nodeGlow)" opacity="0.25"/>
      <circle cx="310" cy="415" r="8" fill="#0a1a3e" stroke="#5cc8ff" stroke-width="1.5"/>
      <circle cx="310" cy="415" r="4" fill="#5cc8ff" opacity="0.9"/>
      <circle cx="310" cy="415" r="1.5" fill="#ffffff"/>

      <!-- Bottom right -->
      <circle cx="372" cy="395" r="18" fill="url(#nodeGlowV)" opacity="0.25"/>
      <circle cx="372" cy="395" r="8" fill="#1a0a3e" stroke="#7c5cff" stroke-width="1.5"/>
      <circle cx="372" cy="395" r="4" fill="#7c5cff" opacity="0.9"/>
      <circle cx="372" cy="395" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Mid layer nodes -->
    <g filter="url(#glow)">
      <!-- Mid left -->
      <circle cx="175" cy="320" r="22" fill="url(#nodeGlowV)" opacity="0.3"/>
      <circle cx="175" cy="320" r="10" fill="#120a3e" stroke="#7c5cff" stroke-width="2"/>
      <circle cx="175" cy="320" r="5" fill="#7c5cff" opacity="0.95"/>
      <circle cx="175" cy="320" r="2" fill="#ffffff"/>

      <!-- Mid center-left -->
      <circle cx="245" cy="340" r="22" fill="url(#nodeGlow)" opacity="0.3"/>
      <circle cx="245" cy="340" r="10" fill="#0a1630" stroke="#5cc8ff" stroke-width="2"/>
      <circle cx="245" cy="340" r="5" fill="#5cc8ff" opacity="0.95"/>
      <circle cx="245" cy="340" r="2" fill="#ffffff"/>

      <!-- Mid right -->
      <circle cx="340" cy="325" r="22" fill="url(#nodeGlowV)" opacity="0.3"/>
      <circle cx="340" cy="325" r="10" fill="#120a3e" stroke="#7c5cff" stroke-width="2"/>
      <circle cx="340" cy="325" r="5" fill="#7c5cff" opacity="0.95"/>
      <circle cx="340" cy="325" r="2" fill="#ffffff"/>
    </g>

    <!-- Upper layer nodes -->
    <g filter="url(#glowStrong)">
      <!-- Upper left -->
      <circle cx="155" cy="210" r="26" fill="url(#nodeGlow)" opacity="0.3"/>
      <circle cx="155" cy="210" r="12" fill="#0a1630" stroke="#5cc8ff" stroke-width="2"/>
      <circle cx="155" cy="210" r="6" fill="#5cc8ff" opacity="0.95"/>
      <circle cx="155" cy="210" r="2.5" fill="#ffffff"/>

      <!-- Upper left-center -->
      <circle cx="195" cy="240" r="26" fill="url(#nodeGlow)" opacity="0.3"/>
      <circle cx="195" cy="240" r="12" fill="#0a1630" stroke="#5cc8ff" stroke-width="2"/>
      <circle cx="195" cy="240" r="6" fill="#5cc8ff" opacity="0.95"/>
      <circle cx="195" cy="240" r="2.5" fill="#ffffff"/>

      <!-- Upper right-center -->
      <circle cx="320" cy="245" r="26" fill="url(#nodeGlowV)" opacity="0.3"/>
      <circle cx="320" cy="245" r="12" fill="#120a3e" stroke="#7c5cff" stroke-width="2"/>
      <circle cx="320" cy="245" r="6" fill="#7c5cff" opacity="0.95"/>
      <circle cx="320" cy="245" r="2.5" fill="#ffffff"/>

      <!-- Upper right -->
      <circle cx="358" cy="215" r="26" fill="url(#nodeGlowV)" opacity="0.3"/>
      <circle cx="358" cy="215" r="12" fill="#120a3e" stroke="#7c5cff" stroke-width="2"/>
      <circle cx="358" cy="215" r="6" fill="#7c5cff" opacity="0.95"/>
      <circle cx="358" cy="215" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Second upper layer -->
    <g filter="url(#glowStrong)">
      <!-- Left of center -->
      <circle cx="220" cy="155" r="24" fill="url(#nodeGlow)" opacity="0.35"/>
      <circle cx="220" cy="155" r="11" fill="#0a1630" stroke="#5cc8ff" stroke-width="2"/>
      <circle cx="220" cy="155" r="5.5" fill="#5cc8ff" opacity="0.95"/>
      <circle cx="220" cy="155" r="2" fill="#ffffff"/>

      <!-- Right of center -->
      <circle cx="292" cy="155" r="24" fill="url(#nodeGlowG)" opacity="0.35"/>
      <circle cx="292" cy="155" r="11" fill="#1e1200" stroke="#ffd86b" stroke-width="2"/>
      <circle cx="292" cy="155" r="5.5" fill="#ffd86b" opacity="0.95"/>
      <circle cx="292" cy="155" r="2" fill="#ffffff"/>
    </g>

    <!-- ======================================================
         SECONDARY NETWORK LAYER (widening the graph)
         ====================================================== -->
    <g opacity="0.3">
      <!-- Far left branch -->
      <line x1="90" y1="360" x2="140" y2="400" stroke="#7c5cff" stroke-width="0.9"/>
      <line x1="90" y1="360" x2="175" y2="320" stroke="#5cc8ff" stroke-width="0.7"/>
      <circle cx="90" cy="360" r="6" fill="#0a0a2e" stroke="#7c5cff" stroke-width="1.2"/>
      <circle cx="90" cy="360" r="2.5" fill="#7c5cff" opacity="0.8"/>

      <!-- Far right branch -->
      <line x1="425" y1="355" x2="372" y2="395" stroke="#5cc8ff" stroke-width="0.9"/>
      <line x1="425" y1="355" x2="340" y2="325" stroke="#7c5cff" stroke-width="0.7"/>
      <circle cx="425" cy="355" r="6" fill="#0a0a2e" stroke="#5cc8ff" stroke-width="1.2"/>
      <circle cx="425" cy="355" r="2.5" fill="#5cc8ff" opacity="0.8"/>

      <!-- Far left upper -->
      <line x1="105" y1="255" x2="155" y2="210" stroke="#5cc8ff" stroke-width="0.8"/>
      <line x1="105" y1="255" x2="175" y2="320" stroke="#7c5cff" stroke-width="0.6"/>
      <circle cx="105" cy="255" r="5" fill="#0a0a2e" stroke="#5cc8ff" stroke-width="1.2"/>
      <circle cx="105" cy="255" r="2" fill="#5cc8ff" opacity="0.8"/>

      <!-- Far right upper -->
      <line x1="408" y1="265" x2="358" y2="215" stroke="#7c5cff" stroke-width="0.8"/>
      <line x1="408" y1="265" x2="340" y2="325" stroke="#5cc8ff" stroke-width="0.6"/>
      <circle cx="408" cy="265" r="5" fill="#0a0a2e" stroke="#7c5cff" stroke-width="1.2"/>
      <circle cx="408" cy="265" r="2" fill="#7c5cff" opacity="0.8"/>
    </g>

    <!-- ======================================================
         CENTER HUB NODE (where network converges into arrow)
         ====================================================== -->

    <!-- Outer ambient glow -->
    <circle cx="256" cy="196" r="70" fill="#5cc8ff" opacity="0.04" filter="url(#glowMega)"/>
    <circle cx="256" cy="196" r="50" fill="#7c5cff" opacity="0.06" filter="url(#glowMega)"/>

    <!-- Hub glow ring -->
    <circle cx="256" cy="196" r="32" fill="none" stroke="#5cc8ff" stroke-width="1"
            opacity="0.4" filter="url(#glow)"/>
    <circle cx="256" cy="196" r="40" fill="none" stroke="#7c5cff" stroke-width="0.7"
            opacity="0.2" filter="url(#glow)"/>

    <!-- Hub core -->
    <circle cx="256" cy="196" r="22" fill="url(#coreGlow)" opacity="0.9" filter="url(#glowStrong)"/>
    <circle cx="256" cy="196" r="14" fill="#0a1630" stroke="#5cc8ff" stroke-width="2.5"/>
    <circle cx="256" cy="196" r="8" fill="#5cc8ff" opacity="0.95" filter="url(#glow)"/>
    <circle cx="256" cy="196" r="4" fill="#a0e8ff"/>
    <circle cx="256" cy="196" r="2" fill="#ffffff"/>

    <!-- ======================================================
         APEX NODE (top of arrow, golden singularity point)
         ====================================================== -->

    <!-- Apex ambient glow -->
    <circle cx="256" cy="85" r="45" fill="#ffd86b" opacity="0.08" filter="url(#glowMega)"/>

    <!-- Apex glow rings -->
    <circle cx="256" cy="85" r="28" fill="none" stroke="#ffd86b" stroke-width="1.5"
            opacity="0.5" filter="url(#glowStrong)"/>
    <circle cx="256" cy="85" r="20" fill="none" stroke="#ffffff" stroke-width="0.8"
            opacity="0.3"/>

    <!-- Apex node -->
    <circle cx="256" cy="85" r="16" fill="url(#nodeGlowG)" opacity="0.8" filter="url(#glowStrong)"/>
    <circle cx="256" cy="85" r="10" fill="#1e1200" stroke="#ffd86b" stroke-width="2.5"/>
    <circle cx="256" cy="85" r="6" fill="#ffd86b" opacity="0.95" filter="url(#glow)"/>
    <circle cx="256" cy="85" r="3" fill="#fff8dc"/>
    <circle cx="256" cy="85" r="1.5" fill="#ffffff"/>

    <!-- Light rays from apex -->
    <g opacity="0.25" filter="url(#glow)">
      <line x1="256" y1="85" x2="195" y2="48" stroke="#ffd86b" stroke-width="1"/>
      <line x1="256" y1="85" x2="317" y2="48" stroke="#ffd86b" stroke-width="1"/>
      <line x1="256" y1="85" x2="175" y2="72" stroke="#ffd86b" stroke-width="0.7"/>
      <line x1="256" y1="85" x2="337" y2="72" stroke="#ffd86b" stroke-width="0.7"/>
      <line x1="256" y1="85" x2="256" y2="42" stroke="#ffd86b" stroke-width="0.8"/>
    </g>

    <!-- ======================================================
         MIDDLE HUB connecting layers
         ====================================================== -->
    <g filter="url(#glowStrong)">
      <!-- The "connector" hub between upper nodes and center -->
      <circle cx="256" cy="265" r="18" fill="url(#nodeGlow)" opacity="0.3"/>
      <circle cx="256" cy="265" r="9" fill="#0a1630" stroke="#5cc8ff" stroke-width="2"/>
      <circle cx="256" cy="265" r="4.5" fill="#5cc8ff" opacity="0.95"/>
      <circle cx="256" cy="265" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Connection from mid-hub to center -->
    <line x1="256" y1="265" x2="256" y2="212" stroke="#5cc8ff" stroke-width="2"
          opacity="0.7" filter="url(#glow)"/>

    <!-- ======================================================
         DECORATIVE CIRCUIT TRACES (subtle bottom area)
         ====================================================== -->
    <g opacity="0.12" stroke="#5cc8ff" stroke-width="0.8" fill="none">
      <path d="M 60 460 L 80 440 L 80 430 L 110 430"/>
      <path d="M 60 475 L 90 445 L 120 445 L 130 435"/>
      <path d="M 450 465 L 430 445 L 400 445"/>
      <path d="M 455 478 L 420 445 L 390 445 L 380 435"/>
    </g>

    <!-- Small accent dots at canvas corners (ensuring full bleed) -->
    <rect x="0" y="0" width="30" height="30" fill="#0b1020" opacity="0.6"/>
    <rect x="482" y="0" width="30" height="30" fill="#0b1020" opacity="0.6"/>
    <rect x="0" y="482" width="30" height="30" fill="#0b1020" opacity="0.6"/>
    <rect x="482" y="482" width="30" height="30" fill="#0b1020" opacity="0.6"/>

  </g>
</svg>
</div>
</body>
</html>
