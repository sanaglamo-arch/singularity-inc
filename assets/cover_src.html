      <stop offset="100%" stop-color="#0b1020" stop-opacity="0"/>

      <stop offset="40%" stop-color="#7c5cff" stop-opacity="0.5"/>

      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8d8ff"/>

      <stop offset="0%" stop-color="#1a2540"/>
      <stop offset="100%" stop-color="#0b1020"/>

      <stop offset="0%" stop-color="#1c2a4a"/>
      <stop offset="100%" stop-color="#243256"/>

      <stop offset="0%" stop-color="#ffd86b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd86b" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow filter for neon elements -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreFilter" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
