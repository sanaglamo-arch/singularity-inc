<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111;color:#0f0;font:13px monospace}#o{white-space:pre-wrap;padding:8px}</style></head>
<body><pre id="o">…</pre><iframe id="f" style="position:absolute;left:-9999px"></iframe><script>
var p=new URLSearchParams(location.search), tab=p.get('tab')||'company', stage=p.get('stage')||'mid', W=+p.get('w')||360, lang=p.get('lang')||'';
var f=document.getElementById('f'); f.width=W; f.height=800;
f.onload=function(){setTimeout(function(){var w=f.contentWindow,d=f.contentDocument,out=[];try{
  var s=w.GAME.state; s.act=9; s.seen=s.seen||{};
  if(lang){ try{ w.GAME_I18N.setLang(lang); w.GAME_UI.renderStatic(); }catch(e){} }
  if(stage==='mid'){s.modelGen=3;s.cash=2e6;s.compute=8e5;s.marketShare=12;s.boostTokens=2;s.researchers=4;s.researchLevel=3;s.datacenters=2;s.gens.laptop=40;s.gens.gpuRig=18;s.gens.serverRack=6;s.funding={seed:true};s.align=4;s.trust=62;}
  else if(stage==='late'){s.modelGen=8;s.cash=1e15;s.compute=1e12;s.marketShare=57;s.boostTokens=3;s.researchers=200;s.researchLevel=16;s.datacenters=14;['laptop','gpuRig','serverRack','gpuCluster','dataCenter','superComp','neuroArray'].forEach((id,i)=>s.gens[id]=200-i*10);s.funding={seed:true,a:true,b:true,c:true};s.align=10;s.trust=70;}
  try{w.location.hash='#'+tab;}catch(e){}
  var navs=d.querySelectorAll('#tabbar button'); for(var i=0;i<navs.length;i++){ if(navs[i].dataset.tab===tab){navs[i].click();break;} if(tab==='more'&&navs[i].dataset.more){navs[i].click();break;} }
  w.GAME_UI.update();w.GAME_UI.update(); var mr=d.getElementById('modalRoot'); if(mr){var ok=mr.querySelector('.primary,button'); if(ok)ok.click();}
  try{w.location.hash='#'+tab;}catch(e){}
  for(var i2=0;i2<navs.length;i2++){ if(navs[i2].dataset.tab===tab){navs[i2].click();break;} } w.GAME_UI.update();
  // audit: horizontal overflow + text clipping on visible elements
  var issues=[], all=d.querySelectorAll('#app *');
  for(var k=0;k<all.length;k++){ var e=all[k]; if(e.offsetParent===null && e.id!=='app') continue; var r=e.getBoundingClientRect(); if(r.width===0&&r.height===0) continue;
    if(r.right>W+1.5) issues.push((e.id||e.className||e.tagName)+' RIGHT-SPILL '+Math.round(r.right)+'>'+W);
    if(r.left<-1.5) issues.push((e.id||e.className||e.tagName)+' LEFT-SPILL '+Math.round(r.left));
    // text clipped (nowrap ellipsis intentional ones excluded: .desc/.sname/.standingsStatus)
    var cl=(e.className&&e.className.indexOf)?e.className:''; var skip=/desc|sname|standingsStatus|tickerText|mk-|cta-/.test(cl);
    if(!skip && e.children.length===0 && e.scrollWidth>e.clientWidth+2 && r.height>0) issues.push((e.id||cl||e.tagName)+' TEXTCLIP sw='+e.scrollWidth+'>cw='+e.clientWidth+' "'+(e.textContent||'').slice(0,18)+'"');
  }
  var doc=d.documentElement; var hscroll=doc.scrollWidth>W+1;
  out.push('@'+W+' '+tab+'/'+stage+' pageHScroll='+hscroll+' issues='+issues.length);
  issues.slice(0,12).forEach(x=>out.push('  '+x));
  document.getElementById('o').textContent=out.join('\n');
}catch(e){document.getElementById('o').textContent='ERR '+e+' '+e.stack;}},2300);};
f.src='index.html';
</script></body></html>
