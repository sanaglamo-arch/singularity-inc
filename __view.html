<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#06060f}iframe{border:0;display:block}</style></head>
<body><iframe id="f" src="index.html"></iframe><script>
/* v2 screenshot harness. params: tab, stage(fresh|early|released|late|over), w, h, lang, outcome */
var p=new URLSearchParams(location.search),
    tab=p.get('tab')||'company', stage=p.get('stage')||'released',
    W=+p.get('w')||390, H=+p.get('h')||820, lang=p.get('lang')||'ru',
    outcome=p.get('outcome')||'agi';
if(lang){try{localStorage.setItem('singularity_inc_lang',lang);}catch(e){}}
try{localStorage.removeItem('singularity_inc_save_v2');}catch(e){}
var f=document.getElementById('f'); f.width=W; f.height=H;
f.onload=function(){setTimeout(function(){var w=f.contentWindow,d=f.contentDocument;try{
  if(lang&&w.GAME_I18N){try{w.GAME_I18N.setLang(lang);}catch(e){}}
  var G=w.GAME,s=G.state;
  s.boughtLaptop=true; s.tapLevel=4;
  if(stage==='early'){ s.cash=120; s.hw.miniserver=2; }
  else if(stage==='released'||stage==='late'){
    s.cash= stage==='late'? 4.2e6 : 850;
    s.premise= stage==='late'?'office':'basement';
    s.committed.miniserver=6; s.committed.workstation= stage==='late'?20:1;
    if(stage==='late'){ s.committed.gpuserver=8; s.committed.rack1u=2; }
    s.version= stage==='late'?4:1;
    s.users= stage==='late'? 9200:140;
    s.price= 6;
    s.safety= stage==='late'?42:68; s.approval=61; s.legality= stage==='late'?34:60;
    s.gameTime= stage==='late'? 22*60 : 4*60;
    s.billDue= stage==='late'? 0 : 0;
  }
  else if(stage==='over'){ s.over=true; s.outcome=outcome; s.version= outcome==='agi'?9:3; s.users=4200; s.gameTime=18*60; s.cash= outcome==='bankrupt'?-12:5400; }
  try{w.location.hash='#'+tab;}catch(e){}
  var navs=d.querySelectorAll('#tabbar button'); for(var i=0;i<navs.length;i++){ if(navs[i].dataset.tab===tab){navs[i].click();break;} }
  if(stage==='over'){ try{ w.GAME_UI.update(); }catch(e){} }
  else { var mr=d.getElementById('modalRoot'); if(mr){mr.classList.add('hidden'); mr.innerHTML='';} }
  w.GAME_UI.update(); w.GAME_UI.update();
}catch(e){document.body.insertAdjacentHTML('beforeend','<pre style="color:red">'+e+'</pre>');}},2000);};
</script></body></html>
